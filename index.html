<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Presensi Harian SMKN 1 Pajangan</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: auto; padding: 20px; text-align: center; }
        
        video, canvas { 
            width: 100%; 
            max-width: 280px; 
            height: 210px; 
            object-fit: cover; 
            border-radius: 12px; 
            margin-bottom: 8px; 
            background-color: #ccc;
        }
        
        input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        #canvas { display: none; }
        #info-lokasi { font-weight: bold; margin-bottom: 15px; color: blue; }
        .sukses { color: green; font-weight: bold; }
        .gagal { color: red; font-weight: bold; }

        .btn-switch {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 6px;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }

        /* Teks kecil untuk reset guru */
        #reset-guru {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
        }
        
        /* Overlay jika aplikasi terkunci total */
        #layar-kunci {
            display: none;
            background-color: #ffe6e6;
            border: 2px solid red;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
 
    <h2>Presensi Harian Sekolah</h2>
    
    <!-- Pesan Kunci Layar -->
    <div id="layar-kunci">
        <h3 style="color: red; margin-top: 0;">🔒 Aplikasi Terkunci</h3>
        <p id="pesan-kunci"></p>
    </div>

    <div id="form-container">
        <select id="kelas" required>
            <option value="">-- Pilih Kelas --</option>
            <option value="X DPIB A">X DPIB A</option>
            <option value="X DPIB B">X DPIB B</option>
            <option value="XI DPIB A">XI DPIB A</option>
            <option value="XI DPIB B">XI DPIB B</option>
            <option value="XII DPIB A">XII DPIB A</option>
            <option value="XII DPIB B">XII DPIB B</option>
            <option value="X RPL A">X RPL A</option>
            <option value="X RPL B">X RPL B</option>
            <option value="XI RPL A">XI RPL A</option>
            <option value="XI RPL B">XI RPL B</option>
            <option value="XII RPL A">XII RPL A</option>
            <option value="XII RPL B">XII RPL B</option>
            <option value="X K3R">X K3R</option>
            <option value="XI K3R">XI K3R</option>
            <option value="XII K3R">XII K3R</option>
        </select>

        <input type="number" id="nis" placeholder="Masukkan NIS" required>
        <input type="text" id="nama" placeholder="Masukkan Nama Lengkap" required>
        
        <select id="status">
            <option value="Datang">Datang</option>
            <option value="Hadir">Hadir (Terkendala Lokasi)</option>
            <option value="Pulang">Pulang</option>
            <option value="Sakit">Sakit</option>
            <option value="Izin">Izin</option>
        </select>
     
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
     
        <button type="button" class="btn-switch" id="btn-ganti-kamera">🔄 Balik Kamera (Depan/Belakang)</button>

        <div id="info-lokasi">Mencari lokasi GPS...</div>
     
        <button id="btn-foto" disabled>Ambil Foto & Kirim</button>
    </div>
    
    <p id="status-pesan"></p>

    <!-- Tombol Rahasia Guru -->
    <div id="reset-guru" onclick="bukaKunciOlehGuru()">Reset Presensi (Khusus Guru)</div>
 
    <script>
        // KODE PIN UNTUK GURU MEMBUKA APLIKASI YANG TERKUNCI
        const PIN_GURU = "123456";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const infoLokasi = document.getElementById('info-lokasi');
        const btnFoto = document.getElementById('btn-foto');
        const btnGantiKamera = document.getElementById('btn-ganti-kamera');
        const statusPesan = document.getElementById('status-pesan');
        const statusSelect = document.getElementById('status');
        
        let kordinatSaatIni = null;
        let isDiDalamRadius = false;
        let posisiKamera = "user"; 
        let streamLokal = null;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxR8CeSpDs24lA36xM_bVtJsIkUrjyy8cpeoBdeeT3cjIy-mB6X_mlgGiYRrh5lGZdjFw/exec";
        const RADIUS_MAKSIMAL = 300; 
        const LAT_SEKOLAH_1 = -7.8597175; const LON_SEKOLAH_1 = 110.2657585; const NAMA_KAMPUS_1 = "Kampus Triwidadi";
        const LAT_SEKOLAH_2 = -7.8938703; const LON_SEKOLAH_2 = 110.2849513; const NAMA_KAMPUS_2 = "Kampus Sendangsari";

        // ================= FITUR PENGUNCI APLIKASI (LOCALSTORAGE) =================
        function dapatkanTanggalHariIni() {
            const date = new Date();
            return `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`;
        }

        function cekKunciAplikasi() {
            const tglHariIni = dapatkanTanggalHariIni();
            let dataAbsen = JSON.parse(localStorage.getItem('data_absen_smkn1')) || {};

            if (dataAbsen.tanggal !== tglHariIni) {
                dataAbsen = { tanggal: tglHariIni, sudahMasuk: false, sudahPulang: false };
                localStorage.setItem('data_absen_smkn1', JSON.stringify(dataAbsen));
            }

            const formContainer = document.getElementById('form-container');
            const layarKunci = document.getElementById('layar-kunci');
            const pesanKunci = document.getElementById('pesan-kunci');

            if (dataAbsen.sudahPulang) {
                formContainer.style.display = "none";
                layarKunci.style.display = "block";
                pesanKunci.innerHTML = "Anda sudah menyelesaikan presensi untuk hari ini. Aplikasi terkunci dan akan terbuka kembali besok pagi.";
            } else if (dataAbsen.sudahMasuk) {
                for (let i = 0; i < statusSelect.options.length; i++) {
                    if (statusSelect.options[i].value !== "Pulang") {
                        statusSelect.options[i].disabled = true; 
                    }
                }
                statusSelect.value = "Pulang"; 
                statusSelect.dispatchEvent(new Event('change')); 
                
                layarKunci.style.display = "block";
                layarKunci.style.borderColor = "blue";
                layarKunci.style.backgroundColor = "#e6f0ff";
                document.querySelector('#layar-kunci h3').style.color = "blue";
                document.querySelector('#layar-kunci h3').innerText = "ℹ️ Mode Pulang";
                pesanKunci.innerHTML = "Anda sudah melakukan absen kedatangan hari ini. Sekarang Anda hanya bisa melakukan absen Pulang.";
            }
        }

        function bukaKunciOlehGuru() {
            const pin = prompt("Masukkan PIN Guru untuk mereset presensi di HP ini:");
            if (pin === PIN_GURU) {
                localStorage.removeItem('data_absen_smkn1');
                alert("Berhasil! Aplikasi telah direset untuk hari ini.");
                window.location.reload(); 
            } else if (pin !== null) {
                alert("PIN Salah! Anda tidak berhak melakukan ini.");
            }
        }

        // ================= KODE LOKASI DAN KAMERA =================
        function hitungJarak(lat1, lon1, lat2, lon2) {
            const R = 6371000; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        }

        function validasiTombol() {
            const statusSaatIni = statusSelect.value;
            if (statusSaatIni === "Sakit" || statusSaatIni === "Izin" || statusSaatIni === "Hadir") {
                infoLokasi.innerHTML = `<span class='sukses'>Mode ${statusSaatIni}: Perekaman diizinkan tanpa batas jarak.</span>`;
                btnFoto.disabled = false;
            } else {
                btnFoto.disabled = !isDiDalamRadius;
            }
        }

        statusSelect.addEventListener('change', validasiTombol);
 
        function jalankanKamera() {
            if (streamLokal) { streamLokal.getTracks().forEach(track => track.stop()); }
            navigator.mediaDevices.getUserMedia({ video: { facingMode: posisiKamera } })
                .then(stream => { streamLokal = stream; video.srcObject = stream; })
                .catch(err => { infoLokasi.innerHTML = "<span class='gagal'>Gagal memuat kamera!</span>"; });
        }

        btnGantiKamera.addEventListener('click', () => {
            posisiKamera = (posisiKamera === "user") ? "environment" : "user";
            jalankanKamera();
        });

        jalankanKamera();
 
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(prosesLokasiSiswa, tanganiErrorLokasi, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
            navigator.geolocation.watchPosition(prosesLokasiSiswa, tanganiErrorLokasi, { enableHighAccuracy: false, timeout: 5000, maximumAge: 0 });
        } else {
            infoLokasi.innerHTML = "<span class='gagal'>Browser tidak mendukung GPS!</span>";
        }

        function prosesLokasiSiswa(position) {
            const isPalsu = position.mocked || (position.coords && position.coords.isMocked) || (position.raw && position.raw.isMocked);
            if (isPalsu) {
                isDiDalamRadius = false; validasiTombol();
                infoLokasi.innerHTML = "<span class='gagal'>🚨 DETEKSI KECURANGAN: FAKE GPS!</span>";
                alert("Matikan Fake GPS Anda sekarang."); return; 
            }
            const latSiswa = position.coords.latitude; const lonSiswa = position.coords.longitude;
            kordinatSaatIni = `${latSiswa}, ${lonSiswa}`;
            
            const jarak1 = hitungJarak(latSiswa, lonSiswa, LAT_SEKOLAH_1, LON_SEKOLAH_1);
            const jarak2 = hitungJarak(latSiswa, lonSiswa, LAT_SEKOLAH_2, LON_SEKOLAH_2);
            
            if (jarak1 <= RADIUS_MAKSIMAL || jarak2 <= RADIUS_MAKSIMAL) {
                isDiDalamRadius = true;
                const kampus = jarak1 <= RADIUS_MAKSIMAL ? NAMA_KAMPUS_1 : NAMA_KAMPUS_2;
                const jarak = jarak1 <= RADIUS_MAKSIMAL ? Math.round(jarak1) : Math.round(jarak2);
                if (statusSelect.value === "Datang" || statusSelect.value === "Pulang") {
                    infoLokasi.innerHTML = `<span class='sukses'>📌 Di ${kampus} (${jarak}m).</span>`;
                }
            } else {
                isDiDalamRadius = false;
                if (statusSelect.value === "Datang" || statusSelect.value === "Pulang") {
                    infoLokasi.innerHTML = `<span class='gagal'>❌ Di luar area sekolah. Presensi dikunci!</span>`;
                }
            }
            validasiTombol();
        }

        function tanganiErrorLokasi(error) {
            isDiDalamRadius = false; validasiTombol();
            infoLokasi.innerHTML = "<span class='gagal'>❌ Gagal mendapatkan lokasi GPS. Pastikan GPS aktif!</span>";
        }

        // ================= KODE PENGIRIMAN DATA =================
        btnFoto.addEventListener('click', () => {
            const kelas = document.getElementById('kelas').value;
            const nis = document.getElementById('nis').value;
            const nama = document.getElementById('nama').value;
            const status = statusSelect.value;
 
            if (!kelas) { alert("Pilih Kelas terlebih dahulu!"); return; }
            if (!nis || !nama) { alert("NIS dan Nama harus diisi!"); return; }
            if ((status === "Datang" || status === "Pulang") && !isDiDalamRadius) { alert("Di luar jangkauan sekolah!"); return; }
 
            statusPesan.innerHTML = "<span style='color:blue;'>Mengirim data... Mohon tunggu...</span>";
            btnFoto.disabled = true;
 
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);

            // =======================================================================
            // FITUR BARU: PERHITUNGAN KETERLAMBATAN LANGSUNG DARI HP SISWA
            // =======================================================================
            const jamMasuk = new Date();
            jamMasuk.setHours(7, 0, 0, 0); // BATAS JAM MASUK PUKUL 07:00 (Bisa diganti)
            const waktuSekarang = new Date();
            
            // Hitung selisih menit (jika hasilnya positif berarti telat)
            const selisihMenit = Math.floor((waktuSekarang - jamMasuk) / 60000);
            
            let teksKeterangan = "-";
            
            if (status === "Datang") {
                teksKeterangan = (selisihMenit > 0) ? `Terlambat: ${selisihMenit} menit` : "Tepat Waktu";
            } else if (status === "Hadir") {
                teksKeterangan = (selisihMenit > 0) ? `Terlambat: ${selisihMenit} menit (Kendala GPS)` : "Tepat Waktu (Kendala GPS)";
            } else if (status === "Izin" || status === "Sakit") {
                teksKeterangan = `Laporan Luar Sekolah (${status})`;
            }
            // =======================================================================
 
            // Tambahkan "keterangan: teksKeterangan" ke dalam payload pengiriman
            const payload = { 
                kelas: kelas, 
                nis: nis, 
                nama: nama, 
                status: status, 
                lokasi: kordinatSaatIni, 
                foto: fotoBase64,
                keterangan: teksKeterangan 
            };
 
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === "success") {
                    statusPesan.innerHTML = "<span class='sukses'>Presensi Berhasil Diterima!</span>";
                    
                    let dataAbsen = JSON.parse(localStorage.getItem('data_absen_smkn1'));
                    if (status === "Datang" || status === "Hadir") {
                        dataAbsen.sudahMasuk = true;
                    } else if (status === "Pulang" || status === "Sakit" || status === "Izin") {
                        dataAbsen.sudahPulang = true; 
                    }
                    localStorage.setItem('data_absen_smkn1', JSON.stringify(dataAbsen));

                    console.log("sukses_absen_tutup");
                    setTimeout(cekKunciAplikasi, 1500); 
                    
                } else {
                    statusPesan.innerHTML = `<span class='gagal'>${data.message}</span>`;
                    btnFoto.disabled = false;
                }
            }).catch(err => {
                statusPesan.innerHTML = `<span class='gagal'>Koneksi Error. Coba lagi.</span>`;
                btnFoto.disabled = false;
            });
        });

        cekKunciAplikasi();
    </script>
</body>
</html>
